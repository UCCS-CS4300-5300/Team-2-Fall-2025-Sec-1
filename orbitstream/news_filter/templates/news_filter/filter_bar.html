<!-- news_filters/templates/news_filters/filter_bar.html -->
<style>
  /* NASA Filter Bar Styling */
  .nasa-filter-bar {
    background: #000000;
    border: 2px solid rgba(96, 165, 250, 0.3);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 32px;
  }

  .nasa-filter-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .nasa-filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .nasa-filter-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nasa-filter-field label {
    font-size: 0.9em;
    font-weight: 600;
    color: #f1f5f9;
  }

  .nasa-filter-field input,
  .nasa-filter-field select {
    padding: 12px 16px;
    font-size: 1em;
    background: rgba(15, 23, 42, 0.6);
    border: 2px solid rgba(96, 165, 250, 0.3);
    border-radius: 8px;
    color: #e2e8f0;
    outline: none;
    transition: all 0.3s ease;
  }

  .nasa-filter-field input:focus,
  .nasa-filter-field select:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    background: rgba(15, 23, 42, 0.8);
  }

  .nasa-filter-field input::placeholder {
    color: #64748b;
  }

  /* Date inputs specific styling */
  .nasa-filter-field input[type="date"] {
    color-scheme: dark;
  }

  .nasa-filter-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .nasa-filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    font-size: 1em;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .nasa-filter-btn-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
  }

  .nasa-filter-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
  }

  .nasa-filter-btn-primary:active {
    transform: translateY(0);
  }

  .nasa-filter-btn-secondary {
    background: rgba(100, 116, 139, 0.6);
    color: #e2e8f0;
    border: 2px solid rgba(148, 163, 184, 0.5);
    backdrop-filter: blur(5px);
  }

  .nasa-filter-btn-secondary:hover {
    background: rgba(100, 116, 139, 0.8);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(100, 116, 139, 0.5);
  }

  .nasa-filter-btn-secondary:active {
    transform: translateY(0);
  }

  .nasa-active-filters {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid rgba(96, 165, 250, 0.2);
  }

  .nasa-filter-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, rgba(139, 92, 246, 0.3) 100%);
    border: 1px solid rgba(96, 165, 250, 0.5);
    color: #bfdbfe;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.9em;
    font-weight: 500;
  }

  /* Responsive Design */
  @media (max-width: 768px) {
    .nasa-filter-bar {
      padding: 20px;
    }

    .nasa-filter-grid {
      grid-template-columns: 1fr;
    }

    .nasa-filter-actions {
      flex-direction: column;
    }

    .nasa-filter-btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<div class="nasa-filter-bar">
  <form method="get" class="nasa-filter-form" id="filterForm">
    <div class="nasa-filter-grid">
      <div class="nasa-filter-field">
        <label for="{{ filter_form.search_query.id_for_label }}">Search</label>
        {{ filter_form.search_query }}
      </div>
      
      <div class="nasa-filter-field">
        <label for="{{ filter_form.source.id_for_label }}">Source</label>
        {{ filter_form.source }}
      </div>
      
      <div class="nasa-filter-field">
        <label for="{{ filter_form.date_from.id_for_label }}">From Date</label>
        {{ filter_form.date_from }}
      </div>
      
      <div class="nasa-filter-field">
        <label for="{{ filter_form.date_to.id_for_label }}">To Date</label>
        {{ filter_form.date_to }}
      </div>
      
      <div class="nasa-filter-field">
        <label for="{{ filter_form.sort_by.id_for_label }}">Sort By</label>
        {{ filter_form.sort_by }}
      </div>
    </div>
    
    <div class="nasa-filter-actions">
      <button type="submit" class="nasa-filter-btn nasa-filter-btn-primary">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
        Apply Filters
      </button>
      <a href="{% url 'space_news:nasa_news' %}" class="nasa-filter-btn nasa-filter-btn-secondary">
        Clear All
      </a>
    </div>
    
    {% if has_active_filters %}
      <div class="nasa-active-filters">
        <span class="nasa-filter-badge">
          <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
            <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
          </svg>
          Filters Active
        </span>
      </div>
    {% endif %}
  </form>
</div>
