# Name of the GitHub Actions workflow
name: CI - Tests & Coverage

# When this workflow should run
on:
  push:
    branches: [ main, features/space_news]  # Run workflow on push to main branch
  pull_request:
    types: [opened, synchronize, reopened]  # Run workflow for PR events

# Define the jobs that run in this workflow
jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner provided by GitHub

    # sets default working dir to orbitstream
    defaults:
      run:
        working-directory: orbitstream

    # Environment variables available to all steps in this job
    env:
      DJANGO_SETTINGS_MODULE: orbitstream.settings  # Django needs this to locate settings.py

    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4
        # This pulls your code from GitHub so subsequent steps can run on it

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Specify the Python version for this workflow
        # GitHub provides a virtual environment for this version

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Upgrade pip to latest version
          pip install -r ../requirements.txt      # Install production dependencies
          pip install -r ../requirements-dev.txt  # Install development/test dependencies
        # Installing dev dependencies is important for pytest, coverage, and other test tools

      # Step 4: Run Django migrations
      - name: Run migrations
        run: |
          python manage.py migrate --noinput || true
        # Applies any database migrations so tests can run.
        # `|| true` ensures workflow doesn’t fail if migrations aren't needed or DB already exists

      # Step 5: Run tests with coverage
      - name: Run tests with coverage (fail if < 80%)
        run: |
          pytest --cov=. --maxfail=1 --disable-warnings -q --cov-report=term-missing --cov-fail-under=80

        # This ensures CI enforces test coverage requirements
        # You can adjust '--cov-fail-under' to the percentage you require
