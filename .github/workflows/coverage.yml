# Name of the workflow
name: Coverage (per-commit)

# This controls when the workflow is going to run
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A workflow is made up of one or more jobs
jobs:

  # This workflow contains a single job named "coverage"
  coverage:

    # The type of runner (i.e., VM) that the job will run on 
    runs-on: ubuntu-latest
    
    # Default settings below set a working-dir that will be set for all run steps in the job
    defaults:
      run:
        working-directory: orbitstream
    
    env:
      DJANGO_SETTINGS_MODULE: orbitstream.settings
     
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (app + coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install coverage

      # Download coverage data from ci-test workflow
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: orbitstream/
        continue-on-error: true

      # If coverage data exists, show the report
      - name: Show test and coverage and check the threshold
        run: |
          if [ -f .coverage ]; then
            python -m coverage report -m --fail-under=80
          else
            echo "No coverage data found. Make sure CI - Tests & Coverage workflow ran first."
            exit 1
          fi
          
