# Name of the workflow
name: Coverage (per-commit)

# This controls when the workflow is going to run
on:
  push: # Triggers the workflow everytime there's a push or pull request for all the branches of the repo
    branches: ["**"]         # Run on every branch for each commit
  pull_request:              # Also run on PRs 
    types: [opened, synchronize, reopened, ready_for_review]

# A workflow is made up of one or more jobs
jobs:

  # This workflow contains a single job named "coverage"
  coverage:

    # The type of runner (i.e., VM) that the job will run on 
    runs-on: ubuntu-latest
    
    # Default settings below set a working-dir that will be set for all run steps in the job
    defaults:
      run:
        working-directory: orbitstream
     
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps (app + coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install coverage

      # If your tests need env vars (DB creds, SECRET_KEY, etc.), add them here via repo/environment secrets.

      - name: Run coverage and check the threshold
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m coverage run manage.py test
          python -m coverage report -m --fail-under=80 # <-- prints the coverage table in the console


