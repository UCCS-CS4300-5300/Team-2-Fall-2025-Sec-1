version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"  # Location of requirements.txt
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"  # Location of GitHub Actions workflows
    schedule:
      interval: "weekly"